<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funtasha | Free Birthday &amp; Fun Tools</title>
<meta name="description" content="Funtasha is a free hub for birthday frames, wishes, and everyday fun tools. No sign-up, everything works in your browser. New tools are on the way.">
<meta name="robots" content="noindex, nofollow">
<style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#fef3c7,#fce7f3 45%,#dbeafe) fixed;color:#1e293b;line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{max-width:560px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);box-shadow:0 12px 26px rgba(30,41,59,.12),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:32px 28px;text-align:center}
.brand{font-weight:800;font-size:34px;letter-spacing:.4px}
.brand .f{color:#db2777}.brand .u{color:#ea580c}
h1{font-size:22px;line-height:1.3;margin:10px 0}
p{font-size:16.5px;margin:10px 0}
.note{font-size:14px;color:#64748b}</style>
</head>
<body>
<div class="card">
<div class="brand"><span class="f">Fun</span><span class="u">tasha</span></div>
<h1>Free birthday &amp; fun tools</h1>
<p>Birthday frames, wishes, and everyday fun tools — free, with no sign-up, everything working right in your browser.</p>
<p>We are building the first set of tools now. New tools are on the way — check back soon.</p>
<p class="note">Funtasha — made for celebrations, big and small.</p>
</div>
</body>
</html>
